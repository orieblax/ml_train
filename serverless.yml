service: mltrain

custom:
  corsOrigin: ${opt:corsOrigin, env:MLTRAIN_CORS_ORIGIN, '*'}

provider:
  name: aws
  runtime: python3.12
  architecture: x86_64
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, env:AWS_REGION, 'us-east-1'}
  logRetentionInDays: 7
  environment:
    MLTRAIN_S3_BUCKET: !Ref MLTrainBucket
    MLTRAIN_DDB_TABLE: !Ref MLTrainTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:ListBucket
          Resource:
            - !GetAtt MLTrainBucket.Arn
            - !Join ["", [!GetAtt MLTrainBucket.Arn, "/*"]]
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - !GetAtt MLTrainTable.Arn
            - !Join ["", [!GetAtt MLTrainTable.Arn, "/index/*"]]

package:
  individually: true
  patterns:
    - "!**"

layers:
  mlRuntime:
    name: ${self:service}-${sls:stage}-ml-runtime
    description: Lightweight scikit-learn, numpy, scipy, joblib, and pypdf runtime for Python 3.12
    compatibleRuntimes:
      - python3.12
    compatibleArchitectures:
      - x86_64
    package:
      artifact: infra/dist/ml-runtime-layer.zip

functions:
  trainer:
    name: ${self:service}-${sls:stage}-trainer
    handler: trainer.handler.lambda_handler
    description: Synchronous document text extractor and asynchronous AutoML scikit-learn trainer
    memorySize: 1024
    timeout: 900
    layers:
      - !Ref MlRuntimeLambdaLayer
    package:
      artifact: infra/dist/trainer-lambda.zip

resources:
  Resources:
    MLTrainBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName:
          !Join [
            "-",
            [
              "${self:service}",
              "${sls:stage}",
              "storage",
              !Ref "AWS::AccountId",
              !Ref "AWS::Region",
            ],
          ]
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - GET
                - PUT
                - HEAD
              AllowedOrigins:
                - ${self:custom.corsOrigin}
              ExposedHeaders:
                - ETag
              MaxAge: 3600

    MLTrainTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-workspace
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        ProvisionedThroughput:
          ReadCapacityUnits: 10
          WriteCapacityUnits: 10
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 10
              WriteCapacityUnits: 10

    InferenceLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName:
          !Join [
            "-",
            ["${self:service}", "${sls:stage}", "inference-role", !Ref "AWS::Region"],
          ]
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: ReadOnlyModelArtifacts
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource:
                    - !Join ["", [!GetAtt MLTrainBucket.Arn, "/models/*"]]

    VercelAppUser:
      Type: AWS::IAM::User
      Properties:
        UserName:
          !Join [
            "-",
            ["${self:service}", "${sls:stage}", "vercel-app", !Ref "AWS::Region"],
          ]
        Policies:
          - PolicyName: ScopedStudioControlPlane
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                  Resource:
                    - !GetAtt MLTrainBucket.Arn
                    - !Join ["", [!GetAtt MLTrainBucket.Arn, "/*"]]
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                    - dynamodb:BatchWriteItem
                    - dynamodb:Query
                    - dynamodb:DescribeTable
                  Resource:
                    - !GetAtt MLTrainTable.Arn
                    - !Join ["", [!GetAtt MLTrainTable.Arn, "/index/*"]]
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                    - lambda:GetFunction
                  Resource:
                    - !GetAtt TrainerLambdaFunction.Arn
                - Effect: Allow
                  Action:
                    - lambda:CreateFunction
                    - lambda:UpdateFunctionCode
                    - lambda:UpdateFunctionConfiguration
                    - lambda:DeleteFunction
                    - lambda:GetFunction
                    - lambda:CreateFunctionUrlConfig
                    - lambda:UpdateFunctionUrlConfig
                    - lambda:DeleteFunctionUrlConfig
                    - lambda:GetFunctionUrlConfig
                    - lambda:AddPermission
                    - lambda:RemovePermission
                    - lambda:TagResource
                  Resource:
                    - !Join [
                        ":",
                        [
                          "arn:aws:lambda",
                          !Ref "AWS::Region",
                          !Ref "AWS::AccountId",
                          "function",
                          "mltrain-model-*",
                        ],
                      ]
                - Effect: Allow
                  Action:
                    - lambda:GetLayerVersion
                  Resource:
                    - !Join [
                        ":",
                        [
                          "arn:aws:lambda",
                          !Ref "AWS::Region",
                          !Ref "AWS::AccountId",
                          "layer",
                          "${self:service}-${sls:stage}-ml-runtime",
                          "*",
                        ],
                      ]
                - Effect: Allow
                  Action:
                    - iam:PassRole
                  Resource:
                    - !GetAtt InferenceLambdaRole.Arn
                  Condition:
                    StringEquals:
                      iam:PassedToService: lambda.amazonaws.com

  Outputs:
    S3BucketName:
      Value: !Ref MLTrainBucket
    DynamoTableName:
      Value: !Ref MLTrainTable
    TrainerLambdaArn:
      Value: !GetAtt TrainerLambdaFunction.Arn
    MLLayerArn:
      Value: !Ref MlRuntimeLambdaLayer
    InferenceRoleArn:
      Value: !GetAtt InferenceLambdaRole.Arn
    VercelAppUserName:
      Value: !Ref VercelAppUser
