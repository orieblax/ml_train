AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Document ML Training & AWS Lambda Deployment Studio (Free-Tier Optimized).
  Provisions S3 storage, Always-Free Provisioned DynamoDB Single-Table, Shared ML Layer,
  Trainer Lambda Worker, scoped Inference IAM Role, and scoped Vercel App IAM Policy.

Parameters:
  ProjectPrefix:
    Type: String
    Default: mltrain
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Lowercase prefix for created AWS resource names.
  ArtifactsBucket:
    Type: String
    Description: S3 bucket holding zipped Lambda Layer and Trainer code packages during deploy.
  LayerS3Key:
    Type: String
    Default: bootstrap/ml-runtime-layer.zip
  TrainerS3Key:
    Type: String
    Default: bootstrap/trainer-lambda.zip
  AllowedCorsOrigin:
    Type: String
    Default: "*"
    Description: Browser origin allowed to PUT documents directly to S3 via presigned URLs.

Resources:
  MLTrainBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectPrefix}-storage-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - !Ref AllowedCorsOrigin
            ExposedHeaders:
              - ETag
            MaxAge: 3600

  MLTrainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectPrefix}-workspace"
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 10
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 10
            WriteCapacityUnits: 10

  MLRuntimeLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${ProjectPrefix}-ml-runtime"
      Description: Lightweight scikit-learn, numpy, scipy, joblib, and pypdf runtime for Python 3.12
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - x86_64
      Content:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref LayerS3Key

  TrainerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectPrefix}-trainer"
      RetentionInDays: 7

  TrainerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectPrefix}-trainer-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TrainerStorageAndDatabase
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt MLTrainBucket.Arn
                  - !Sub "${MLTrainBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MLTrainTable.Arn
                  - !Sub "${MLTrainTable.Arn}/index/*"

  TrainerLambda:
    Type: AWS::Lambda::Function
    DependsOn: TrainerLogGroup
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-trainer"
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: trainer.handler.lambda_handler
      Role: !GetAtt TrainerLambdaRole.Arn
      MemorySize: 1024
      Timeout: 900
      Layers:
        - !Ref MLRuntimeLayer
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref TrainerS3Key
      Environment:
        Variables:
          MLTRAIN_S3_BUCKET: !Ref MLTrainBucket
          MLTRAIN_DDB_TABLE: !Ref MLTrainTable

  InferenceLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectPrefix}-inference-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadOnlyModelArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "${MLTrainBucket.Arn}/models/*"

  VercelAppUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${ProjectPrefix}-vercel-app-${AWS::Region}"
      Policies:
        - PolicyName: ScopedStudioControlPlane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt MLTrainBucket.Arn
                  - !Sub "${MLTrainBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt MLTrainTable.Arn
                  - !Sub "${MLTrainTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunction
                Resource:
                  - !GetAtt TrainerLambda.Arn
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectPrefix}-model-*"
              - Effect: Allow
                Action:
                  - lambda:GetLayerVersion
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${ProjectPrefix}-ml-runtime:*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt InferenceLambdaRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  S3BucketName:
    Value: !Ref MLTrainBucket
  DynamoTableName:
    Value: !Ref MLTrainTable
  TrainerLambdaArn:
    Value: !GetAtt TrainerLambda.Arn
  MLLayerArn:
    Value: !Ref MLRuntimeLayer
  InferenceRoleArn:
    Value: !GetAtt InferenceLambdaRole.Arn
  VercelAppUserName:
    Value: !Ref VercelAppUser
